# Railway — Nexora API (monorepo)
# Create a Railway project → New Service → GitHub repo → set Root Directory empty (repo root).
# Add a Postgres plugin and link DATABASE_URL automatically.

[build]
builder = "NIXPACKS"
# Nixpacks already runs `npm ci` in install — do not run it again (EBUSY on cache mounts).
buildCommand = "npm run build -w packages/shared && npm run build -w packages/stores && npm run build -w packages/connectors && npm run build -w packages/agent-core && npm run build -w apps/api"

[deploy]
startCommand = "node db/migrate.js && npm run start -w apps/api"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
