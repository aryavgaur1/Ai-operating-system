# Same command as root netlify.toml so filter/base layouts cannot escape the repo.
[build]
  command = "ROOT=$(git rev-parse --show-toplevel) && cd \"$ROOT\" && npm ci && npm run build -w apps/web"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
