# Build from monorepo git root. Avoid "cd ../.." — with some CLI/filter layouts that
# escapes the repo and npm ci fails (no package-lock) in ~30s.
[build]
  command = "ROOT=$(git rev-parse --show-toplevel) && cd \"$ROOT\" && npm ci && npm run build -w apps/web"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
